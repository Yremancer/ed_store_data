name: ed_store_data

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d
      - clickhouse_data:/var/lib/clickhouse
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  generator:
    build: .
    container_name: generator
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy

  superset-postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - superset_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER:-postgres}" -d postgres']
      interval: 5s
      timeout: 3s
      retries: 12

  superset-redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  superset:
    build: ./superset
    ports:
      - "127.0.0.1:8088:8088"
    env_file:
      - .env
    depends_on:
      clickhouse:
        condition: service_healthy
      superset-postgres:
        condition: service_healthy
      superset-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s

volumes:
  clickhouse_data:
  superset_postgres_data:
